version: '3.8'

services:
  # Neo4j Graph Database (Graph RAG Engine)
  neo4j:
    image: neo4j:5.17-community
    container_name: nottoday_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Telemetry Cache
  redis:
    image: redis:7.2-alpine
    container_name: nottoday_redis
    ports:
      - "6379:6379"

