version: '3.8'

services:
  # Neo4j Graph Database (Graph RAG Engine)
  neo4j:
    image: neo4j:5.17-community
    container_name: nottoday_neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Telemetry Cache
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    container_name: nottoday_redis
    ports:
      - "127.0.0.1:6379:6379"

  # FastAPI Cloud Gateway & PSTN 119 Webhook — DISABLED:
  # ./server/Dockerfile이 저장소에 없어 빌드 불가. 구현 후 주석 해제할 것.
  # (secrets come from .env; port bound to localhost only)
  # cloud-gateway:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: nottoday_cloud_gateway
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #   environment:
  #     - NEO4J_URI=neo4j://neo4j:7687
  #     - NEO4J_USER=neo4j
  #     - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  #     - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
  #     - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
  #   restart: unless-stopped

volumes:
  neo4j_data:
